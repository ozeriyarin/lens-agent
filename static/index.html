<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>lens-agent</title>
<style>
  /* Single-file PWA, no build step (plan.md). Dark by default: it is a camera app. */
  :root {
    --bg: #111318; --panel: #1b1e26; --line: #2a2e3a; --text: #e8eaf0; --muted: #9aa0b0;
    --accent: #5ac8fa; --ok: #4cd964; --warn: #ffb340; --bad: #ff5f57; --live: #ff5f57;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  #stats { font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; text-decoration: underline dotted; }
  #stage { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 3 / 4; }
  #stage.live { outline: 2px solid var(--live); }
  video, canvas#shot { width: 100%; height: 100%; object-fit: contain; display: block; }
  canvas#shot { position: absolute; inset: 0; display: none; }
  canvas#overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  form { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 160px; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 16px; }
  button, select { padding: 12px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #000;
    font-weight: 600; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button#liveBtn.on { background: var(--live); color: #fff; }
  #zoomRow { display: flex; align-items: center; gap: 10px; margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
  #zoomRow input[type=range] { flex: 1; accent-color: var(--accent); }
  #stage { touch-action: none; }   /* pinch is ours, not the page's */
  #status { min-height: 22px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  #status.bad { color: var(--bad); }
  .scene { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .card h3 { margin: 0 0 4px; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
  .card h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; }
  .answer { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .est { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; }
  .badge.cached { background: #1f3b2a; color: var(--ok); }
  .badge.paid { background: #3b2f1f; color: var(--warn); }
  .badge.esc { background: #3a1f3b; color: #e6a3ff; }
  .badge.known { background: #1f2e3b; color: var(--accent); }
  .badge.new { background: #2a2e3a; color: var(--muted); }
  .panelbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; font-size: 14px; }
  .panelbox[hidden] { display: none; }
  .panelbox h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .panelbox h2 button, .panelbox td button { padding: 2px 10px; font-size: 13px; }
  .panelbox table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; }
  .panelbox th, .panelbox td { text-align: left; padding: 4px; border-bottom: 1px solid var(--line); font-weight: 400; vertical-align: top; }
  .panelbox th { color: var(--muted); font-size: 12px; }
  #entitiesBtn { font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline dotted; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  #panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; font-size: 14px; }
  #panel[hidden] { display: none; }
  #panel h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  #panel h2 button { padding: 2px 10px; font-size: 13px; }
  #panel table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; }
  #panel th, #panel td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); font-weight: 400; }
  #panel th { color: var(--muted); font-size: 12px; }
  #panel td.num, #panel th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.warn { background: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>lens-agent</h1>
    <div><button id="entitiesBtn" type="button" title="what the agent remembers">memory</button> · <span id="stats" title="month-to-date spend / cap · tap for details">…</span></div>
  </header>

  <section id="panel" hidden></section>
  <section id="entities" class="panelbox" hidden></section>

  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="shot"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div id="zoomRow"><span>zoom</span><input id="zoom" type="range" min="1" max="4" step="0.1" value="1"><span id="zoomVal">1.0×</span></div>

  <form id="scanForm">
    <input id="question" type="text" maxlength="500" placeholder="Optional question, e.g. is this plant healthy?" autocomplete="off">
    <button id="scanBtn" type="submit" disabled>Scan</button>
    <button id="liveBtn" type="button" class="secondary" disabled title="send a frame every interval while the scene changes">Live</button>
    <select id="interval" title="live interval">
      <option value="1000">1 s</option><option value="1500" selected>1.5 s</option>
      <option value="2000">2 s</option><option value="3000">3 s</option><option value="5000">5 s</option>
    </select>
    <select id="sensitivity" title="how much the scene must change before a live frame is sent">
      <option value="low">low sens.</option><option value="medium" selected>medium sens.</option><option value="high">high sens.</option>
    </select>
    <button id="flipBtn" type="button" class="secondary" disabled title="switch between rear and front camera">Flip</button>
    <button id="againBtn" type="button" class="secondary" hidden>Again</button>
  </form>
  <div id="status">Starting camera…</div>

  <section id="results"></section>
</main>

<script>
/* lens-agent client. Three ways of using the same POST /scan:
   - tap (001): freeze a frame, send, show cards + overlay on the frozen frame.
   - live (003): every INTERVAL ms, if the scene changed (thumbnail diff) and no request is
     in flight, send the live frame with X-Live: 1 and redraw the overlay over the video.
   - both: a question, if typed, rides along as X-Question.
   The overlay is a <canvas> sized to the frame's own pixels and CSS-scaled with the video, so
   the normalized bboxes from the model map 1:1 (003 FR-8). */

const $ = (id) => document.getElementById(id);
const video = $('cam'), shot = $('shot'), overlay = $('overlay'), stage = $('stage');
const scanBtn = $('scanBtn'), liveBtn = $('liveBtn'), againBtn = $('againBtn'), statusEl = $('status'), results = $('results');
const MAX_UPLOAD_SIDE = 1280;
/* Motion gate (003 FR-2). Two rules, both on a coarse 16x12 grayscale thumbnail (coarse = hand
   shake and sensor noise average out):
   - CHANGED: the frame differs from the last frame we *sent* by more than the sensitivity threshold.
   - STILL:   the frame differs from the *previous tick* by less than a small amount, i.e. the
              movement has stopped. We only send when both hold, so panning or a trembling hand
              never triggers a scan; arriving at a new view and holding it does. */
const SENSITIVITY = { low: 16, medium: 10, high: 6 };   // CHANGED threshold, mean abs diff 0..255
const STILL_THRESHOLD = 4;                              // STILL threshold between consecutive ticks
const THUMB_W = 16, THUMB_H = 12;
/* A change *inside* a tracked box (a smile inside a face box, a hand picking up the mug)
   is tiny for the whole-frame thumbnail, so each tracked box is also compared on its own,
   on a finer 64x48 thumbnail, against the frame that was last sent. Region threshold is
   a fraction of the global one: the box is small, so noise averages out less. */
const FINE_W = 64, FINE_H = 48;
const REGION_FACTOR = 0.5;   // a change over ~10-15% of a box at full contrast scores ~15-20 here; medium sens -> 5
const STALE_MS = 8000;            // overlay dims after this (003 FR-5); it is only replaced by the next result
/* Tracker (003, "moving boxes"): between model results each box follows its object. On every
   result we remember a small grayscale crop of each box from the frame that was sent; a few
   times a second we look for that crop near the box's last position in the live video and
   move the box there. Pure JS, no model, no cost. A box whose crop can no longer be matched
   (object left the frame or changed too much) is dropped. */
const TRACK_FPS = 8, TRACK_W = 160;         // working resolution: long side 160 px
const TRACK_SEARCH = 0.35;                  // search radius as a fraction of the box size
const TRACK_LOST = 48;                      // mean abs diff above this (0..255), after brightness normalization = lost
const EMPTY_RETRY_MS = 4000;                // a result with no objects is retried after this even if the view is unchanged

/* --- auth: shared secret from #token=, kept in localStorage, sent as Bearer ------------- */
const TOKEN_KEY = 'lens.token';
(function adoptTokenFromFragment() {
  const m = /(?:^#|&)token=([^&]+)/.exec(location.hash);
  if (m) {
    try { localStorage.setItem(TOKEN_KEY, decodeURIComponent(m[1])); } catch {}
    history.replaceState(null, '', location.pathname + location.search);
  }
})();
function authHeaders() {
  let t = null;
  try { t = localStorage.getItem(TOKEN_KEY); } catch {}
  return t ? { Authorization: `Bearer ${t}` } : {};
}

function setStatus(text, bad = false) { statusEl.textContent = text; statusEl.className = bad ? 'bad' : ''; }
window.addEventListener('error', (e) => setStatus(`Page error: ${e.message}`, true));
window.addEventListener('unhandledrejection', (e) => setStatus(`Page error: ${e.reason?.message || e.reason}`, true));
function fmtUsd(v) { return v < 0.01 ? `$${v.toFixed(4)}` : `$${v.toFixed(2)}`; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* --- camera ------------------------------------------------------------------------------ */
let frameSource = video;          // what we capture from; tests may swap in a canvas (window.lens.setSource)
let facing = 'environment';       // 'environment' = rear, 'user' = front

/* Zoom. Hardware zoom (the camera track supports a `zoom` constraint: Android Chrome, recent
   iOS) changes the frames themselves. Otherwise digital: the preview is CSS-scaled and every
   capture (upload, thumbnail, tracker) reads the same central crop, so boxes stay aligned. */
const zoomState = { value: 1, hardware: null, max: 4 };
function cropRect() {
  const [vw, vh] = sourceSize();
  if (zoomState.hardware || zoomState.value <= 1) return [0, 0, vw, vh];
  const z = zoomState.value, cw = vw / z, ch = vh / z;
  return [(vw - cw) / 2, (vh - ch) / 2, cw, ch];
}
function drawSource(ctx, dw, dh) {   // draw the (possibly cropped) current frame into dw x dh
  const [sx, sy, sw, sh] = cropRect();
  ctx.drawImage(frameSource, sx, sy, sw, sh, 0, 0, dw, dh);
}
function applyPreviewTransform() {
  const mirror = facing === 'user' ? ' scaleX(-1)' : '';
  const scale = zoomState.hardware || zoomState.value <= 1 ? '' : ` scale(${zoomState.value})`;
  video.style.transform = (scale + mirror).trim();
  overlay.style.transform = mirror.trim();   // the overlay already represents the cropped view
}
async function setZoom(z) {
  z = Math.min(zoomState.max, Math.max(1, Math.round(z * 10) / 10));
  if (z === zoomState.value) return;
  zoomState.value = z;
  $('zoom').value = z; $('zoomVal').textContent = `${z.toFixed(1)}×`;
  if (zoomState.hardware && video.srcObject) {
    try { await video.srcObject.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: z }] }); } catch {}
  }
  applyPreviewTransform();
  live.lastSent = null; live.lastSentFine = null; live.prevThumb = null;   // framing changed: next still view is a new view
  if (!live.on) { drawOverlay(null); }
}
$('zoom').addEventListener('input', (e) => setZoom(Number(e.target.value)));
(function pinch() {   // two-finger pinch on the stage adjusts zoom, live or not
  let startDist = 0, startZoom = 1;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  stage.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { startDist = dist(e.touches); startZoom = zoomState.value; } }, { passive: true });
  stage.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && startDist) { e.preventDefault(); setZoom(startZoom * dist(e.touches) / startDist); } }, { passive: false });
  stage.addEventListener('touchend', () => { startDist = 0; });
})();
function sourceSize() {
  return frameSource === video ? [video.videoWidth, video.videoHeight] : [frameSource.width, frameSource.height];
}
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('Camera API unavailable. Open this page over HTTPS (or localhost).', true);
    return;
  }
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    fitStageTo(video.videoWidth, video.videoHeight);
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    zoomState.hardware = caps.zoom && caps.zoom.max > 1 ? caps.zoom : null;
    zoomState.max = zoomState.hardware ? Math.min(8, caps.zoom.max) : 4;
    $('zoom').max = zoomState.max;
    zoomState.value = 1; $('zoom').value = 1; $('zoomVal').textContent = '1.0×';
    $('zoomRow').title = zoomState.hardware ? 'optical/hardware zoom' : 'digital zoom (crop)';
    applyPreviewTransform();
    enableControls();
    if (!live.on) setStatus('Point at a scene and tap Scan, or switch Live on.');
  } catch (err) {
    setStatus(`Camera blocked: ${err.message}. Allow camera access and reload.`, true);
  }
}
async function flipCamera() {
  facing = facing === 'environment' ? 'user' : 'environment';
  $('flipBtn').disabled = true;
  await startCamera();          // works mid-live: the loop keeps reading from the same <video>
  live.lastSent = null; live.lastSentFine = null; live.prevThumb = null;   // new camera = new scene; the next still frame is sent
  if (!live.on) { drawOverlay(null); shot.style.display = 'none'; againBtn.hidden = true; scanBtn.disabled = false; }
  $('flipBtn').disabled = false;
}
$('flipBtn').addEventListener('click', flipCamera);
function enableControls() { scanBtn.disabled = false; liveBtn.disabled = false; $('flipBtn').disabled = false; }
function fitStageTo(w, h) {
  // The stage takes the frame's own aspect ratio (no crop), and the overlay canvas gets the
  // frame's pixel size, so overlay coordinates == frame coordinates after CSS scaling.
  if (!w || !h) return;
  stage.style.aspectRatio = `${w} / ${h}`;
  if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
}

function captureJpeg(freeze) {
  const [, , cw, ch] = cropRect();
  if (!cw) throw new Error('camera not ready');
  const scale = Math.min(1, MAX_UPLOAD_SIDE / Math.max(cw, ch));
  shot.width = Math.round(cw * scale); shot.height = Math.round(ch * scale);
  drawSource(shot.getContext('2d'), shot.width, shot.height);
  fitStageTo(shot.width, shot.height);
  if (freeze) { shot.style.transform = facing === 'user' ? 'scaleX(-1)' : ''; shot.style.display = 'block'; }   // tap mode: freeze the frame the result refers to
  return new Promise((resolve) => shot.toBlob(resolve, 'image/jpeg', 0.85));
}

/* --- motion gate (003 FR-2) --------------------------------------------------------------- */
const thumbCanvas = document.createElement('canvas');
thumbCanvas.width = THUMB_W; thumbCanvas.height = THUMB_H;
function grayFrom(canvas, w, h) {
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const g = canvas.getContext('2d', { willReadFrequently: true });
  drawSource(g, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const gray = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) gray[j] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
  return gray;
}
function thumbnail() { return grayFrom(thumbCanvas, THUMB_W, THUMB_H); }
const fineCanvas = document.createElement('canvas');
function fineThumbnail() { return grayFrom(fineCanvas, FINE_W, FINE_H); }
function regionDiff(a, b, box) {   // mean abs diff inside a normalized box on FINE_W x FINE_H grays
  const x0 = Math.max(0, Math.floor(box.x * FINE_W)), y0 = Math.max(0, Math.floor(box.y * FINE_H));
  const x1 = Math.min(FINE_W, Math.ceil((box.x + box.w) * FINE_W)), y1 = Math.min(FINE_H, Math.ceil((box.y + box.h) * FINE_H));
  let sum = 0, n = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { sum += Math.abs(a[y * FINE_W + x] - b[y * FINE_W + x]); n++; }
  return n ? sum / n : 0;
}
function meanAbsDiff(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
  return s / a.length;
}

/* --- the request --------------------------------------------------------------------------- */
async function postScan(blob, question, live) {
  const headers = { ...authHeaders(), 'Content-Type': 'image/jpeg' };
  if (question) headers['X-Question'] = encodeURIComponent(question);
  if (live) headers['X-Live'] = '1';
  const res = await fetch('/scan', { method: 'POST', body: blob, headers });
  if (!res.ok) {
    const detail = (await res.json().catch(() => ({}))).detail;
    const err = new Error(`${res.status}: ${typeof detail === 'string' ? detail : 'request failed'}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* --- overlay renderer (003 FR-4, FR-5) ---------------------------------------------------- */
let lastResponse = null, lastDrawnAt = 0;
function drawOverlay(resp, stale = false, tracked = null) {
  const W = overlay.width, H = overlay.height;
  const g = overlay.getContext('2d');
  g.clearRect(0, 0, W, H);
  if (!resp) { tracker.clear(); return; }
  const r = resp.result;
  const base = Math.max(12, Math.round(Math.min(W, H) / 40));   // font scales with the frame
  g.globalAlpha = stale ? 0.45 : 1;
  g.lineWidth = Math.max(2, base / 6);
  g.font = `600 ${base}px system-ui, sans-serif`;
  g.textBaseline = 'top';

  const mirrored = overlay.style.transform.includes('scaleX(-1)');
  const label = (lines, x, y, color) => {
    // Text with a backing rectangle so it reads on any scene. When the preview is mirrored
    // (front camera) the canvas is mirrored too, so text is drawn flipped back to read normally.
    const pad = base * 0.3, lh = base * 1.25;
    const w = Math.max(...lines.map((t) => g.measureText(t).width)) + pad * 2;
    const h = lines.length * lh + pad * 2 - (lh - base);
    const yy = Math.min(Math.max(0, y), H - h), xx = Math.min(Math.max(0, x), W - w);
    g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(xx, yy, w, h);
    g.fillStyle = color;
    if (mirrored) { g.save(); g.translate(xx + w, 0); g.scale(-1, 1); lines.forEach((t, i) => g.fillText(t, pad, yy + pad + i * lh)); g.restore(); }
    else lines.forEach((t, i) => g.fillText(t, xx + pad, yy + pad + i * lh));
    return h;
  };

  const unboxed = [];
  r.objects.forEach((o, oi) => {
    const pct = `${Math.round(o.confidence * 100)}%`;
    const ent = (resp.entities || [])[oi];
    const lines = [`${o.label} · ${pct}${ent && ent.known ? ` · seen ${ent.sightings}×` : ''}`];
    if (o.person) {
      if (o.person.mood) lines.push(`mood: ${o.person.mood.value} (~${Math.round(o.person.mood.confidence * 100)}%)`);
      if (o.person.age_range) lines.push(`age: ${o.person.age_range.value.replace('_', ' ')} (~${Math.round(o.person.age_range.confidence * 100)}%)`);
    }
    if (o.answer) lines.push(`→ ${o.answer}`);
    const box = tracked ? tracked.get(o) : o.bbox;   // tracked position if we have one, else the model's
    if (box === null) return;                          // tracked and lost: not on screen any more
    if (!box) { unboxed.push(lines[0]); return; }
    const x = box.x * W, y = box.y * H, w = box.w * W, h = box.h * H;
    const color = o.category === 'person' ? '#ffb340' : (ent && ent.known ? '#8fd3ff' : '#5ac8fa');
    g.strokeStyle = color; g.strokeRect(x, y, w, h);
    const block = lines.length * base * 1.25 + base * 0.6;
    label(lines, x, y - block < 0 ? y + g.lineWidth : y - block, color);   // above the box, or inside when at the top edge
  });
  if (unboxed.length) label(['no box: ' + unboxed.join(', ')], base * 0.5, base * 0.5, '#e8eaf0');

  // Bottom line: scene sentence (+ answer), wrapped to at most two lines.
  const bottom = [r.scene, r.answer ? `→ ${r.answer}` : ''].filter(Boolean).join('  ');
  const words = bottom.split(' '), lines = []; let cur = '';
  g.font = `500 ${base * 0.9}px system-ui, sans-serif`;
  for (const wd of words) {
    const t = cur ? `${cur} ${wd}` : wd;
    if (g.measureText(t).width > W - base * 2 && cur) { lines.push(cur); cur = wd; } else cur = t;
    if (lines.length === 2) break;
  }
  if (lines.length < 2 && cur) lines.push(cur); else if (lines.length === 2) lines[1] += '…';
  const lh = base * 0.9 * 1.25, h = lines.length * lh + base * 0.6;
  g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, H - h, W, h);
  g.fillStyle = '#e8eaf0';
  if (mirrored) { g.save(); g.translate(W, 0); g.scale(-1, 1); }
  lines.forEach((t, i) => g.fillText(t, base * 0.5, H - h + base * 0.3 + i * lh));
  if (mirrored) g.restore();
  g.globalAlpha = 1;
}
setInterval(() => {  // staleness fade while live (the tracker redraws on its own when it has boxes)
  if (live.on && lastResponse && !tracker.items.length && Date.now() - lastDrawnAt > STALE_MS) drawOverlay(lastResponse, true);
}, 1000);

/* --- cards (001) ---------------------------------------------------------------------------- */
function estimate(e, label) {
  if (!e) return '';
  return `<div class="est">${label}: ${escapeHtml(e.value)} <span class="meta">(estimate, ${Math.round(e.confidence * 100)}% sure)</span></div>`;
}
function renderCards(resp) {
  const r = resp.result;
  const badge = (resp.cached
    ? '<span class="badge cached">cached · free</span>'
    : `<span class="badge paid">${fmtUsd(resp.cost_usd)} · ${resp.latency_ms} ms</span>`)
    + (resp.escalated ? `<span class="badge esc" title="primary: ${escapeHtml(resp.primary_model)}">escalated → ${escapeHtml(resp.model.split(':').pop())}</span>` : '');
  let html = `<div class="scene">${escapeHtml(r.scene)} ${badge}</div>`;
  if (r.answer) html += `<div class="card"><div class="answer">${escapeHtml(r.answer)}</div></div>`;
  if (!r.objects.length) html += '<div class="empty">Nothing identifiable in this frame.</div>';
  r.objects.forEach((o, i) => {
    const e = (resp.entities || [])[i];
    const known = e ? (e.known
      ? `<span class="badge known" title="first seen ${e.first_seen.slice(0, 10)}">known · seen ${e.sightings}×</span>`
      : '<span class="badge new">new</span>') : '';
    html += `<div class="card">
      <h3>${escapeHtml(o.label)}${known} <small>${escapeHtml(o.category)} · ${escapeHtml(o.position.replace('_', ' '))} · ${Math.round(o.confidence * 100)}%</small></h3>
      ${o.identity ? `<div class="meta">${escapeHtml(o.identity)}</div>` : ''}
      ${o.person ? estimate(o.person.mood, 'Mood') + estimate(o.person.age_range, 'Age') : ''}
      ${o.answer ? `<div class="answer">${escapeHtml(o.answer)}</div>` : ''}
    </div>`;
  });
  results.innerHTML = html;
}
function showResponse(resp) {
  lastResponse = resp; lastDrawnAt = Date.now();
  drawOverlay(resp);
  renderCards(resp);
  if (live.on) tracker.arm(resp, shot);   // shot holds the exact frame the boxes refer to
}

/* --- tracker ---------------------------------------------------------------------------------- */
const tracker = {
  items: [], timer: null, work: document.createElement('canvas'), scale: 1,
  gray(srcEl, sw, sh) {
    const w = this.work; if (w.width !== sw || w.height !== sh) { w.width = sw; w.height = sh; }
    const g = w.getContext('2d', { willReadFrequently: true });
    if (srcEl === frameSource) drawSource(g, sw, sh); else g.drawImage(srcEl, 0, 0, sw, sh);
    const d = g.getImageData(0, 0, sw, sh).data, out = new Uint8Array(sw * sh);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) out[j] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
    return out;
  },
  arm(resp, frameEl) {
    this.clear();
    const [fw, fh] = [frameEl.width, frameEl.height];
    if (!fw || !fh) return;
    this.scale = TRACK_W / Math.max(fw, fh);
    const sw = Math.round(fw * this.scale), sh = Math.round(fh * this.scale);
    const frame = this.gray(frameEl, sw, sh);
    for (const o of resp.result.objects) {
      if (!o.bbox) continue;
      const x = Math.round(o.bbox.x * sw), y = Math.round(o.bbox.y * sh);
      const w = Math.max(4, Math.round(o.bbox.w * sw)), h = Math.max(4, Math.round(o.bbox.h * sh));
      if (w * h > sw * sh * 0.6) { this.items.push({ o, x, y, w, h, tpl: null, lost: false }); continue; } // near-full-frame box: pin, don't track
      const tpl = new Uint8Array(w * h); let mean = 0;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const v = frame[Math.min(sh - 1, y + j) * sw + Math.min(sw - 1, x + i)]; tpl[j * w + i] = v; mean += v; }
      this.items.push({ o, x, y, w, h, tpl, tplMean: mean / (w * h), lost: false });
    }
    this.sw = sw; this.sh = sh;
    if (!this.timer) this.timer = setInterval(() => this.step(), 1000 / TRACK_FPS);
  },
  clear() { this.items = []; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  step() {
    if (!this.items.length || !lastResponse || document.hidden) return;
    const [fw, fh] = sourceSize(); if (!fw) return;
    const sw = this.sw, sh = this.sh;
    let frame; try { frame = this.gray(frameSource, sw, sh); } catch { return; }
    for (const it of this.items) {
      if (!it.tpl || it.lost) continue;
      const rx = Math.max(2, Math.round(it.w * TRACK_SEARCH)), ry = Math.max(2, Math.round(it.h * TRACK_SEARCH));
      let best = Infinity, bx = it.x, by = it.y;
      const step = it.w * it.h > 1500 ? 2 : 1;   // sample big templates sparsely
      for (let dy = -ry; dy <= ry; dy += 2) for (let dx = -rx; dx <= rx; dx += 2) {
        const x0 = it.x + dx, y0 = it.y + dy;
        if (x0 < -it.w * 0.5 || y0 < -it.h * 0.5 || x0 > sw - it.w * 0.5 || y0 > sh - it.h * 0.5) continue;
        // Compare with the brightness difference removed, so auto-exposure or a lamp
        // switching on does not look like the object vanishing.
        let psum = 0, n = 0;
        for (let j = 0; j < it.h; j += step) { const yy = y0 + j; if (yy < 0 || yy >= sh) continue;
          for (let i = 0; i < it.w; i += step) { const xx = x0 + i; if (xx < 0 || xx >= sw) continue; psum += frame[yy * sw + xx]; n++; } }
        if (!n) continue;
        const shift = psum / n - it.tplMean;
        let sum = 0;
        for (let j = 0; j < it.h; j += step) { const yy = y0 + j; if (yy < 0 || yy >= sh) continue;
          for (let i = 0; i < it.w; i += step) { const xx = x0 + i; if (xx < 0 || xx >= sw) continue;
            sum += Math.abs(frame[yy * sw + xx] - shift - it.tpl[j * it.w + i]); } }
        if (sum / n < best) { best = sum / n; bx = x0; by = y0; }
      }
      if (best > TRACK_LOST || bx + it.w < 0 || by + it.h < 0 || bx > sw || by > sh) { it.lost = true; continue; }
      it.x = bx; it.y = by;
    }
    const tracked = new Map(this.items.map((it) => [it.o, it.lost ? null : { x: it.x / sw, y: it.y / sh, w: it.w / sw, h: it.h / sh }]));
    drawOverlay(lastResponse, Date.now() - lastDrawnAt > STALE_MS, tracked);
  },
};

/* --- stats header + panel (002 FR-6) ------------------------------------------------------- */
let lastStats = null;
async function refreshStats() {
  try {
    const res = await fetch('/stats', { headers: authHeaders() });
    if (res.status === 401) { setStatus('This server needs a token: open the page as /#token=YOUR_TOKEN once.', true); return; }
    const s = await res.json();
    lastStats = s;
    renderHeader();
    if (!$('panel').hidden) renderPanel(s);
  } catch { $('stats').textContent = ''; }
}
function renderHeader() {
  const s = lastStats;
  if (!s) return;
  let text = `${fmtUsd(s.month_to_date_usd)} / $${s.cap_usd.toFixed(0)} · ${s.model.split(':').pop()}`;
  if (live.on || live.spent > 0) text = `live ${fmtUsd(live.spent)} · ${fmtUsd(live.perMinute())}/min · ` + text;
  $('stats').textContent = text;
}
function renderPanel(s) {
  const pct = Math.min(100, (s.month_to_date_usd / s.cap_usd) * 100);
  const rows = s.per_model.map((m) => `<tr><td>${escapeHtml(m.model.split(':').pop())}</td>
      <td class="num">${m.calls}${m.failed ? ` <span class="meta">(${m.failed} failed)</span>` : ''}</td>
      <td class="num">${fmtUsd(m.cost_usd)}</td><td class="num">${m.avg_latency_ms} ms</td></tr>`).join('');
  const recent = s.recent.slice(-10).reverse().map((e) => `<tr><td>${e.ts.slice(11, 19)}</td>
      <td>${escapeHtml(e.model.split(':').pop())}${e.source === 'live' ? ' <span class="meta">live</span>' : ''}${e.tier === 'escalation' ? ' <span class="badge esc">esc</span>' : ''}${e.status === 'failed' ? ' <span class="badge paid">failed</span>' : ''}</td>
      <td class="num">${e.input_tokens}/${e.output_tokens}</td><td class="num">${fmtUsd(e.cost_usd)}</td></tr>`).join('');
  const hitRate = s.cache_hits + s.cache_misses ? Math.round(100 * s.cache_hits / (s.cache_hits + s.cache_misses)) : 0;
  const src = s.scans_by_source || {};
  $('panel').innerHTML = `
    <h2>This month <button type="button" class="secondary" id="closePanel">close</button></h2>
    <div>${fmtUsd(s.month_to_date_usd)} of $${s.cap_usd.toFixed(2)} spent · ${fmtUsd(s.remaining_usd)} left</div>
    <div class="bar"><i class="${pct > 80 ? 'warn' : ''}" style="width:${pct}%"></i></div>
    <div class="meta">${s.scans_this_month} scans (${src.tap ?? 0} tap · ${src.live ?? 0} live) · ${s.escalations} escalated${s.escalation_model ? ` to ${escapeHtml(s.escalation_model.split(':').pop())}` : ' (escalation off)'} · cache hit rate ${hitRate}%</div>
    <table><tr><th>model</th><th class="num">calls</th><th class="num">cost</th><th class="num">avg latency</th></tr>${rows || '<tr><td colspan="4" class="meta">no calls yet</td></tr>'}</table>
    <table><tr><th>time (UTC)</th><th>model</th><th class="num">tokens in/out</th><th class="num">cost</th></tr>${recent || '<tr><td colspan="4" class="meta">no scans yet</td></tr>'}</table>`;
  $('closePanel').onclick = () => { $('panel').hidden = true; };
}
/* Entities panel (004 FR-8): what the agent remembers, with Forget. */
async function renderEntities() {
  const box = $('entities');
  let list = [];
  try {
    const res = await fetch('/entities', { headers: authHeaders() });
    if (res.status === 401) { setStatus('This server needs a token: open the page as /#token=YOUR_TOKEN once.', true); return; }
    list = await res.json();
  } catch { list = []; }
  const rows = list.map((e) => `<tr><td><b>${escapeHtml(e.label)}</b><div class="meta">${escapeHtml(e.identity)}</div></td>
      <td>${e.sightings}×<div class="meta">${e.first_seen.slice(0, 10)} → ${e.last_seen.slice(5, 16).replace('T', ' ')}</div></td>
      <td><button type="button" class="secondary" data-forget="${e.id}">forget</button></td></tr>`).join('');
  box.innerHTML = `<h2>Memory · ${list.length} ${list.length === 1 ? 'entity' : 'entities'}
      <span><button type="button" class="secondary" id="forgetAll" ${list.length ? '' : 'disabled'}>forget all</button>
      <button type="button" class="secondary" id="closeEntities">close</button></span></h2>
    ${rows ? `<table><tr><th>object</th><th>seen</th><th></th></tr>${rows}</table>` : '<div class="meta">Nothing remembered yet. Scan something with a distinctive look.</div>'}
    <div class="meta">Only descriptions and embeddings are stored, never images. People are never remembered.</div>`;
  box.querySelectorAll('[data-forget]').forEach((b) => b.addEventListener('click', async () => {
    await fetch(`/entities/${encodeURIComponent(b.dataset.forget)}`, { method: 'DELETE', headers: authHeaders() }); renderEntities();
  }));
  $('forgetAll').onclick = async () => { if (confirm('Forget every remembered entity?')) { await fetch('/entities', { method: 'DELETE', headers: authHeaders() }); renderEntities(); } };
  $('closeEntities').onclick = () => { box.hidden = true; };
}
$('entitiesBtn').addEventListener('click', () => { const box = $('entities'); box.hidden = !box.hidden; if (!box.hidden) renderEntities(); });

$('stats').addEventListener('click', async () => {
  const panel = $('panel');
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  if (lastStats) renderPanel(lastStats);
  await refreshStats();
});

/* --- tap mode (001) -------------------------------------------------------------------------- */
$('scanForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (live.on) live.stop('Live mode off.');
  scanBtn.disabled = true;
  setStatus('Scanning…');
  try {
    const blob = await captureJpeg(true);
    showResponse(await postScan(blob, $('question').value.trim(), false));
    setStatus('Done. Tap Again for a new frame.');
    againBtn.hidden = false;
  } catch (err) {
    setStatus(err.message, true);
    shot.style.display = 'none'; drawOverlay(null);   // back to the live preview to re-aim
    scanBtn.disabled = false;
  }
  refreshStats();
});
againBtn.addEventListener('click', () => {
  shot.style.display = 'none'; drawOverlay(null); results.innerHTML = '';
  const [w, h] = sourceSize(); fitStageTo(w, h);
  againBtn.hidden = true; scanBtn.disabled = false;
  setStatus('Point at a scene and tap Scan, or switch Live on.');
});

/* --- live mode (003 FR-1, FR-3, FR-6) ---------------------------------------------------------- */
const live = {
  on: false, timer: null, inFlight: false, lastSent: null, lastSentFine: null, prevThumb: null, sent: 0, skipped: 0, lastEmptyAt: 0,
  spent: 0, charges: [],   // [{t, cost}] for the per-minute projection
  perMinute() { const cut = Date.now() - 60000; return this.charges.filter((c) => c.t > cut).reduce((a, c) => a + c.cost, 0); },
  start() {
    if (this.on) return;
    this.on = true; this.lastSent = null; this.lastSentFine = null; this.prevThumb = null; this.sent = 0; this.skipped = 0;
    shot.style.display = 'none'; againBtn.hidden = true; results.innerHTML = '';
    const [w, h] = sourceSize(); fitStageTo(w, h);
    liveBtn.classList.add('on'); liveBtn.textContent = 'Stop'; stage.classList.add('live');
    this.timer = setInterval(() => this.tick(), intervalMs());
    setStatus('Live: sending a frame only when the scene changes.');
    renderHeader();
    this.tick();
  },
  stop(msg, bad = false) {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer); this.timer = null;
    liveBtn.classList.remove('on'); liveBtn.textContent = 'Live'; stage.classList.remove('live');
    drawOverlay(null);   // boxes belong to a frame that is no longer on screen
    setStatus(msg || `Live mode off. ${this.sent} frames sent, ${this.skipped} skipped as unchanged.`, bad);
    renderHeader();
  },
  async tick() {
    if (!this.on || this.inFlight || document.hidden) return;   // FR-3: one in flight; pause when hidden
    let thumb;
    try { thumb = thumbnail(); } catch { return; }
    const prev = this.prevThumb; this.prevThumb = thumb;
    const still = !prev || meanAbsDiff(thumb, prev) < STILL_THRESHOLD;
    const sens = SENSITIVITY[$('sensitivity').value];
    let changed = !this.lastSent || meanAbsDiff(thumb, this.lastSent) >= sens;
    let fine = null;
    if (!changed && this.lastSentFine && tracker.items.length) {
      // Whole frame unchanged: did anything change inside a tracked box (a smile, a hand)?
      fine = fineThumbnail();
      const sw = tracker.sw, sh = tracker.sh;
      changed = tracker.items.some((it) => !it.lost && it.tpl && regionDiff(fine, this.lastSentFine,
        { x: it.x / sw, y: it.y / sh, w: it.w / sw, h: it.h / sh }) >= sens * REGION_FACTOR);
    }
    // "Nothing identifiable" is not an answer worth keeping: try the same view again after a moment.
    if (!changed && this.lastEmptyAt && Date.now() - this.lastEmptyAt > EMPTY_RETRY_MS) changed = true;
    if (!changed || !still) {
      this.skipped++;
      setStatus(`Live: ${this.sent} sent, ${this.skipped} skipped · ${still ? 'view unchanged, waiting' : 'moving…'}`);
      return;
    }
    this.inFlight = true;
    try {
      const blob = await captureJpeg(false);
      const resp = await postScan(blob, $('question').value.trim(), true);
      this.lastSent = thumb; this.lastSentFine = fine || fineThumbnail(); this.sent++;
      this.lastEmptyAt = resp.result.objects.length ? 0 : Date.now();
      if (!resp.cached) { this.spent += resp.cost_usd; this.charges.push({ t: Date.now(), cost: resp.cost_usd }); }
      showResponse(resp);
      setStatus(`Live: ${this.sent} sent, ${this.skipped} skipped · last ${resp.cached ? 'cached' : fmtUsd(resp.cost_usd) + ' · ' + resp.latency_ms + ' ms'}${resp.escalated ? ' · escalated' : ''}`);
      renderHeader();
      if (this.sent % 5 === 0) refreshStats();
    } catch (err) {
      if (err.status === 402 || err.status === 401) { this.stop(`Live stopped: ${err.message}`, true); refreshStats(); }
      else setStatus(`Live: ${err.message} (still trying)`, true);
    } finally {
      this.inFlight = false;
    }
  },
};
liveBtn.addEventListener('click', () => (live.on ? live.stop() : live.start()));
function intervalMs() { const v = Number($('interval').value); return v >= 250 ? v : 1500; }   // never a zero-delay loop
$('interval').addEventListener('change', () => { if (live.on) { clearInterval(live.timer); live.timer = setInterval(() => live.tick(), intervalMs()); } });
document.addEventListener('visibilitychange', () => { if (live.on) setStatus(document.hidden ? 'Live paused (tab hidden).' : 'Live resumed.'); });

/* Test hook: lets an automated check drive the loop from a canvas instead of the camera. */
window.lens = {
  setSource(el) { frameSource = el; fitStageTo(el.width, el.height); enableControls(); },
  live, drawOverlay, postScan, meanAbsDiff, thumbnail, fineThumbnail, regionDiff, SENSITIVITY, STILL_THRESHOLD, flipCamera, tracker, showResponse, setZoom, zoomState, cropRect, renderEntities,
};

startCamera();
refreshStats();
</script>
</body>
</html>
