[project]
name = "lens-agent"
version = "0.1.0"
description = "Camera-based multimodal vision agent: typed object detection with a hard budget cap."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[google,anthropic]==2.59.0",
    "fastapi==0.156.8",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pillow==13.0.0",
    "imagehash==4.3.2",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP046"]  # long lines are fine where they read better; the formatter is not enforced

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E731", "E702"]
