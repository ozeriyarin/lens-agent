# fly.toml app configuration file generated for lens-agent on 2026-10-25T14:59:38+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lens-agent'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  BUDGET_USD = '5'
  DB_PATH = '/data/lens.db'
  KB_DIR = '/data/kb'
  MODEL = 'google:gemini-2.5-flash'

[[mounts]]
  source = 'lens_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
